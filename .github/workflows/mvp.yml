name: MVP Pipeline CI

on:
  push:
    branches: [ main, final ]
  pull_request:
    branches: [ main, final ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run MVP Unit Tests
        run: |
          pytest -q tests/test_mvp_unit.py
      - name: Run MVP E2E Tests
        run: |
          pytest -q tests/test_mvp_e2e.py
      - name: Run Full MVP 22-Case Pipeline
        run: |
          python run_mvp_pipeline.py --all
