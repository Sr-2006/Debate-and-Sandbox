name: MVP Pipeline CI

on:
  push:
    branches: [ main, final ]
  pull_request:
    branches: [ main, final ]

env:
  DEBATE_MOCK_LLM: "1"
  RL_OPERATING_MODE: "SHADOW"
  RL_LAPTOP1_TRANSPORT: "disabled"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r debate/requirements.txt
          pip install -r Arse_shadow/requirements.txt
          pip install pytest

      - name: Validate Phase 3-4 Report and Event Contracts
        run: |
          python -m pytest -q contracts/tests/test_phase34_report_schema.py -vv

      - name: Run MVP Unit Tests
        run: |
          python -m pytest -q tests/test_mvp_unit.py -x -vv

      - name: Run Attestation & State Machine Unit Tests
        run: |
          python -m pytest -q Arse_shadow/shadow_sandbox/tests/test_attestation.py -vv
          python -m pytest -q Arse_shadow/shadow_sandbox/tests/test_state_machine.py -vv

      - name: Run RL Unit Tests
        run: |
          python -m pytest -q rl_engine/tests

      - name: Run MVP E2E Tests
        run: |
          python -m pytest -q tests/test_mvp_e2e.py

      - name: Run Full MVP 22-Case Pipeline
        run: |
          python run_mvp_pipeline.py --all

      - name: Validate CI Safety Constraints
        run: |
          python -m rl_engine.cli validate-ci-safety
